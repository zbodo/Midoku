name: Bark success notification

on:
  workflow_run:
    workflows:
      - macOS Desktop
      - SwiftLint
      - Legacy AltStore Source (manual only)
    types: [completed]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send Bark notification
        env:
          BARK_SERVER_URL: ${{ vars.BARK_SERVER_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import quote, urlsplit

          server = os.environ.get("BARK_SERVER_URL", "").strip().rstrip("/")
          key = os.environ.get("BARK_KEY", "").strip()
          if not server or not key:
              print("::warning::Configure BARK_SERVER_URL and BARK_KEY; skipping notification.")
              raise SystemExit(0)
          parsed_server = urlsplit(server)
          if (parsed_server.scheme != "https" or not parsed_server.hostname
                  or parsed_server.username or parsed_server.password
                  or parsed_server.query or parsed_server.fragment):
              raise SystemExit("BARK_SERVER_URL must be an HTTPS server URL without credentials, query or fragment.")

          with open(os.environ["GITHUB_EVENT_PATH"]) as event_file:
              event = json.load(event_file)
          run = event["workflow_run"]
          title = f"{event['repository']['full_name']} · Actions 成功"
          body = f"{run['name']}\n分支：{run['head_branch']}\n运行 #{run['run_number']}"
          endpoint = server + "/" + "/".join(
              quote(value, safe="") for value in (key, title, body))
          result = subprocess.run(
              ["curl", "--request", "GET", "--get", "--fail", "--silent",
               "--show-error", "--connect-timeout", "10", "--max-time", "30",
               endpoint, "--data-urlencode", "group=example",
               "--data-urlencode", "ttl=600",
               "--data-urlencode", f"url={run['html_url']}"],
              capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit("Bark request failed.")
          try:
              response = json.loads(result.stdout)
          except json.JSONDecodeError:
              raise SystemExit("Bark returned an invalid response.")
          if response.get("code") != 200:
              raise SystemExit("Bark did not accept the notification.")
          print("Bark notification sent.")
          PY
