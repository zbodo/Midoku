name: Build native macOS app

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Prepare artifact filename
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          commit_hash=$(git rev-parse --short=8 HEAD)
          echo "filename=Midoku-macOS-$commit_hash.dmg" >> "$GITHUB_OUTPUT"
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Prepare signing keychain path
        run: |
          echo "SIGNING_KEYCHAIN=$RUNNER_TEMP/midoku-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate
        id: signing
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_BASE64" || -z "$CERTIFICATE_PASSWORD" || ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::Configure MACOS_CERTIFICATE_BASE64, MACOS_CERTIFICATE_PASSWORD and APPLE_TEAM_ID repository secrets.'
            exit 1
          fi
          umask 077
          certificate_path="$RUNNER_TEMP/midoku-signing.p12"
          trap 'rm -f "$certificate_path"' EXIT
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security set-keychain-settings -lut 21600 "$SIGNING_KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$SIGNING_KEYCHAIN"
          security import "$certificate_path" -k "$SIGNING_KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$SIGNING_KEYCHAIN" >/dev/null
          identities=$(security find-identity -v -p codesigning "$SIGNING_KEYCHAIN")
          identity=$(printf '%s\n' "$identities" | \
            awk '/^[[:space:]]*[0-9]+\) [A-Fa-f0-9]+ "Developer ID Application:/ {print $2}')
          if [[ ! "$identity" =~ ^[A-Fa-f0-9]{40}$ ]] || \
            ! printf '%s\n' "$identities" | grep -F "($TEAM_ID)\"" >/dev/null; then
            echo '::error::The P12 must contain exactly one valid Developer ID Application identity, including its private key, matching APPLE_TEAM_ID.'
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import subprocess

          keychain = os.environ["SIGNING_KEYCHAIN"]
          original = shlex.split(subprocess.check_output(
              ["security", "list-keychains", "-d", "user"], text=True))
          Path(keychain + ".search-list.json").write_text(json.dumps(original))
          subprocess.run(
              ["security", "list-keychains", "-d", "user", "-s", keychain, *original],
              check=True)
          PY
          if ! security find-identity -v -p codesigning | grep -F "$identity" >/dev/null; then
            echo '::error::The imported signing identity is not discoverable through the user keychain search list.'
            exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"
      - name: Build signed app
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/Desktop \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" ENABLE_HARDENED_RUNTIME=YES \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN --timestamp" build
      - name: Verify Apple Silicon architecture
        run: |
          lipo build/Desktop/Build/Products/Release/Midoku.app/Contents/MacOS/Midoku \
            -verify_arch arm64
      - name: Verify Developer ID signature
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app_path=build/Desktop/Build/Products/Release/Midoku.app
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signature=$(codesign --display --verbose=4 "$app_path" 2>&1)
          printf '%s\n' "$signature"
          printf '%s\n' "$signature" | grep -F 'Authority=Developer ID Application:'
          printf '%s\n' "$signature" | grep -Fx "TeamIdentifier=$TEAM_ID"
          printf '%s\n' "$signature" | grep -E '^Timestamp='
      - name: Create and sign DMG
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          DMG_FILENAME: ${{ steps.artifact.outputs.filename }}
        run: |
          set -euo pipefail
          staging_path=$(mktemp -d "$RUNNER_TEMP/midoku-dmg.XXXXXX")
          trap 'rm -rf "$staging_path"' EXIT
          ditto build/Desktop/Build/Products/Release/Midoku.app "$staging_path/Midoku.app"
          ln -s /Applications "$staging_path/Applications"
          hdiutil create -volname Midoku -srcfolder "$staging_path" \
            -fs HFS+ -format UDZO -ov "$DMG_FILENAME"
          codesign --sign "$SIGNING_IDENTITY" --keychain "$SIGNING_KEYCHAIN" \
            --timestamp "$DMG_FILENAME"
          codesign --verify --strict --verbose=2 "$DMG_FILENAME"
          hdiutil verify "$DMG_FILENAME"
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ${{ steps.artifact.outputs.filename }}
          archive: false
          if-no-files-found: error
      - name: Remove signing keychain
        if: always()
        shell: bash
        run: |
          cleanup_status=0
          if [[ -f "$SIGNING_KEYCHAIN.search-list.json" ]]; then
            python3 - <<'PY' || cleanup_status=$?
          import json
          import os
          from pathlib import Path
          import subprocess

          original = json.loads(Path(
              os.environ["SIGNING_KEYCHAIN"] + ".search-list.json").read_text())
          subprocess.run(
              ["security", "list-keychains", "-d", "user", "-s", *original],
              check=True)
          PY
          fi
          if [[ -f "$SIGNING_KEYCHAIN" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || cleanup_status=$?
          fi
          rm -f "$RUNNER_TEMP/midoku-signing.p12" "$SIGNING_KEYCHAIN.search-list.json"
          exit "$cleanup_status"

  notify:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Send Bark notification
        env:
          BARK_SERVER_URL: ${{ vars.BARK_SERVER_URL }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          RUN_NAME: ${{ github.workflow }}
          RUN_BRANCH: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from urllib.parse import quote, urlsplit

          server = os.environ.get("BARK_SERVER_URL", "").strip().rstrip("/")
          key = os.environ.get("BARK_KEY", "").strip()
          if not server or not key:
              print("::warning::Configure BARK_SERVER_URL and BARK_KEY; skipping notification.")
              raise SystemExit(0)
          parsed_server = urlsplit(server)
          if (parsed_server.scheme != "https" or not parsed_server.hostname
                  or parsed_server.username or parsed_server.password
                  or parsed_server.query or parsed_server.fragment):
              raise SystemExit("BARK_SERVER_URL must be an HTTPS server URL without credentials, query or fragment.")

          run = {
              "name": os.environ["RUN_NAME"],
              "head_branch": os.environ["RUN_BRANCH"],
              "run_number": os.environ["RUN_NUMBER"],
              "html_url": os.environ["RUN_URL"],
          }
          title = f"{os.environ['GITHUB_REPOSITORY']} · Actions 成功"
          body = f"{run['name']}\n分支：{run['head_branch']}\n运行 #{run['run_number']}"
          endpoint = server + "/" + "/".join(
              quote(value, safe="") for value in (key, title, body))
          result = subprocess.run(
              ["curl", "--request", "GET", "--get", "--fail", "--silent",
               "--show-error", "--connect-timeout", "10", "--max-time", "30",
               endpoint, "--data-urlencode", "group=example",
               "--data-urlencode", "ttl=600",
               "--data-urlencode", f"url={run['html_url']}"],
              capture_output=True, text=True)
          if result.returncode != 0:
              raise SystemExit("Bark request failed.")
          try:
              response = json.loads(result.stdout)
          except json.JSONDecodeError:
              raise SystemExit("Bark returned an invalid response.")
          if response.get("code") != 200:
              raise SystemExit("Bark did not accept the notification.")
          print("Bark notification sent.")
          PY
