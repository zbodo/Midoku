name: Build native macOS app

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Build
        run: |
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/Desktop \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - name: Verify Apple Silicon architecture
        run: |
          lipo build/Desktop/Build/Products/Release/Midoku.app/Contents/MacOS/Midoku \
            -verify_arch arm64
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Desktop/Build/Products/Release/Midoku.app Midoku-macOS.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Midoku-macOS-unsigned
          path: Midoku-macOS.zip
          if-no-files-found: error
