name: Build native macOS app

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build/Desktop \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/Desktop/Build/Products/Release/Midoku.app Midoku-macOS.zip
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Midoku-macOS-unsigned
          path: Midoku-macOS.zip
          if-no-files-found: error
