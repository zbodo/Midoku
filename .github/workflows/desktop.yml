name: macOS Desktop

on:
  pull_request:
    paths: ["Desktop/**", "Midoku.xcodeproj/**", ".github/workflows/desktop.yml"]
  push:
    branches: [main]
    paths: ["Desktop/**", "Midoku.xcodeproj/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  core:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Test portable desktop core
        run: swift test --package-path Desktop/Core
  desktop:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - name: Show build environment
        run: |
          sw_vers
          xcodebuild -version
          xcrun swift --version
      - name: Build and test native app
        run: |
          xcodebuild -project Midoku.xcodeproj -scheme Midoku -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/Desktop \
            -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-test-results
          path: build/Desktop/Logs/Test/*.xcresult
          if-no-files-found: ignore
